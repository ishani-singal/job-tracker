<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Job Tracker Quick Add — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        padding: 20px;
        max-width: 420px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
      }
      input {
        font-size: 13px;
        padding: 6px 8px;
        border: 1px solid #d4d4d4;
        border-radius: 4px;
      }
      button {
        font-size: 13px;
        padding: 6px 14px;
        border-radius: 4px;
        border: none;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      .saved {
        color: #15803d;
        font-size: 12px;
        margin-left: 10px;
      }
      .saved.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Job Tracker Quick Add — Settings</h1>
    <label>
      API base URL
      <input id="apiBase" type="text" placeholder="http://localhost:4100" />
    </label>
    <button id="saveBtn">Save</button>
    <span id="savedMsg" class="saved hidden">Saved ✓</span>
    <script src="options.js"></script>
  </body>
</html>
